<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - openDAW</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 1rem;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        p {
            margin: 0;
            opacity: 0.8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Completing Sign In</h1>
        <p>Please wait while we complete your authentication...</p>
    </div>

    <script>
        // Handle OAuth callback and redirect back to the main app
        try {
            // Extract any hash or search params that Supabase might have added
            const hash = window.location.hash;
            const search = window.location.search;
            
            // Build the redirect URL back to the main app
            let redirectUrl = window.location.origin;
            if (hash) {
                redirectUrl += hash;
            } else if (search) {
                redirectUrl += search;
            }
            
            console.log('Auth callback - redirecting to:', redirectUrl);
            
            // Redirect back to the main app with the auth tokens
            window.location.href = redirectUrl;
        } catch (error) {
            console.error('Auth callback error:', error);
            // Fallback: redirect to main app without parameters
            window.location.href = window.location.origin;
        }
    </script>
</body>
</html>
